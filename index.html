<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deja Brews</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>CJ CAMASIS</h1>

    <button id="click">click</button>

    <header>
        <nav>
            <span></span>
            <ul>
                <li><a href="#products">Products</a></li>
                <li><a href="quality">Quality</a></li>
                <li><a href="services">Services</a></li>
                <li><a href="branch">Branch</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="products">
            <h2 class="products">Products</h2>
            <p>kapeng barako, classic coffe, ice coffee, milk coffee
            </p>
        </section>

        <section id="Quality">
            <h2 class="quality">quality</h2>
            <p>goods and best coffee</p>
        </section>
        <section id="branch">
            <h2 class="branch">branch</h2>
            <p>singapor, taiwan, italy, americ
            </p>
        </section>

        <section id="services">
            <h2 class="services">lets enjoy to drink coffe!!</h2>
            <form action="#">
                <!-- Name -->
                <label for="order">order</label>
                <input type="text" id="order" name="order" required>

                <!-- Email -->
                <label for="payment">payment</label>
                <input type="payment" name="payment" id="payment" required>

                <!-- Message -->
                <label for="message">Message</label>
                <textarea name="message" id="message" rows="5" required></textarea>

                <!-- Submit -->
                <button type="submit">Send Message</button>
            </form>
        </section>
    </main>
    <script src="script.js"></script>
</body>


</html>
